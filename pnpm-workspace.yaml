# pnpm 11 refuses to run dependency postinstall scripts unless listed here.
# esbuild (vite's own dep) needs its script; the two below don't — the chat
# function works with them skipped — so they stay disabled.
allowBuilds:
  '@google/genai': false
  # core-js (via @vercel/og) stampa solo un annuncio
  core-js: false
  esbuild: true
  protobufjs: false

minimumReleaseAgeExclude:
  - convex-test@0.0.63
  - '@tanstack/ai-client@0.40.1'
  - '@tanstack/ai-gemini@0.38.2'
  - '@tanstack/ai-react@0.31.1'
  - '@tanstack/ai@0.71.0'

# @convex-dev/better-auth 0.12.5 vuole better-auth >=1.6.11 <1.7 (PIANO §1.1):
# nessuna dipendenza deve tirare dentro la 1.7.
overrides:
  better-auth: 1.6.33
