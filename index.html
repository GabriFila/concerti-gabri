<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabri ai concerti</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0a0b">
<script>
  // set theme before paint to avoid flash; mirrors the React logic
  (function(){
    try{
      var m=localStorage.getItem("theme");
      if(m!=="dark"&&m!=="light"&&m!=="system") m="dark";
      var resolved = m==="system" ? (window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light") : m;
      document.documentElement.setAttribute("data-theme",resolved);
    }catch(e){ document.documentElement.setAttribute("data-theme","dark"); }
  })();
</script>
<!-- Fraunces e Inter sono self-hosted: le @font-face stanno in cima a
     src/styles.css e i .woff2 escono in dist/. Niente <link> a
     fonts.googleapis.com, che bloccava il primo paint su un'origine terza. -->
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
